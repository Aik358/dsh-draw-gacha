name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: syntax check
        run: node --check lib/index.js && node --check lib/client.js
      - name: signal statistics test
        run: node signal.test.js
